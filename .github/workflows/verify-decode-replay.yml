name: verify decode_replay (temporary)

on:
  workflow_dispatch:

jobs:
  cuda:
    runs-on: arc-gpu-candle
    container:
      # cudarc 0.12.1 (pinned transitively via this repo's candle-core = 0.8.0) hard-panics on
      # any CUDA toolkit version it doesn't have a match arm for -- its build.rs only recognizes
      # up to 12.6. 13.0.2 (used by candle-nvfp4's CI, a much newer candle pin) fails here with
      # "Unsupported cuda toolkit version: `13.0`." Pin to the newest version cudarc 0.12.1 groks.
      image: nvidia/cuda:12.6.3-cudnn-devel-ubuntu24.04
      options: --gpus all
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: apt update && apt install curl build-essential libssl-dev pkg-config -y
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - run: cargo test -p candle_graph
      - run: cargo run --example decode_replay
