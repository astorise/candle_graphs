name: verify decode_replay (temporary)

on:
  workflow_dispatch:

jobs:
  cuda:
    runs-on: arc-gpu-candle
    container:
      image: nvidia/cuda:13.0.2-cudnn-devel-ubuntu24.04
      options: --gpus all
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: apt update && apt install curl build-essential libssl-dev pkg-config -y
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - run: cargo test -p candle_graph
      - run: cargo run --example decode_replay
