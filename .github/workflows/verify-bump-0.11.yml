name: verify candle 0.11 bump (temporary)

on:
  workflow_dispatch:

jobs:
  cuda:
    runs-on: arc-gpu-candle
    container:
      # candle-core/candle-nn now track huggingface/candle's main branch (0.11.0), which pulls
      # in cudarc 0.19.x -- unlike the decode-position-graph-replay branch (still on the old
      # candle 0.8.0 / cudarc 0.12.1 pin), this build supports CUDA up to 13.x. Reuse the image
      # already validated green on astorise/candle-nvfp4, which pins the same candle-core line.
      image: nvidia/cuda:13.0.2-cudnn-devel-ubuntu24.04
      options: --gpus all
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: apt update && apt install curl build-essential libssl-dev pkg-config graphviz -y
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - run: cargo test -p candle_graph -- --test-threads=1 --nocapture
        env:
          RUST_BACKTRACE: full
      - run: cargo run --example cache
        env:
          RUST_BACKTRACE: full
